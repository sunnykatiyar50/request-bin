<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Request Bin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-card">
        <h1>Request Bin</h1>
        <form id="loginForm">
            <label for="passwordInput">Admin password:</label>
            <input type="password" id="passwordInput" autocomplete="current-password" required autofocus />
            <p id="loginError" class="error-text" role="alert"></p>
            <button type="submit">Sign in</button>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
